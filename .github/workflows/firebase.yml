name: Deploy to Firebase

# يرفع كود الخادم وقواعد الحماية إلى Firebase تلقائيًا عند كل تحديث (يعمل بعد إضافة FIREBASE_SA).
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function packages
        if: ${{ vars.DEPLOY_FUNCTIONS == 'true' }}
        run: npm install --prefix functions --no-audit --no-fund

      - name: Write service account key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "::error::The FIREBASE_SA secret is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy functions and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          # Cloud Functions need the Blaze plan. Set the repository variable DEPLOY_FUNCTIONS to "true" once it is active.
          TARGETS: ${{ vars.DEPLOY_FUNCTIONS == 'true' && 'functions,firestore:rules' || 'firestore:rules' }}
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only "$TARGETS" --project ibrahim-dd12e --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/out.txt" || {
            # Surface the reason as annotations so it can be read without opening the full log.
            grep -iE "error|denied|disabled|billing|enable|not found|failed|permission|quota" "$RUNNER_TEMP/out.txt" | grep -v "^\s*$" | tail -15 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }
