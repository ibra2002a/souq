name: Scheduled notifications

# يرسل إشعارات OneSignal المجانية: تذكير الهدية اليومية، وبطولة اللودو الليلية ونتائجها.
# يحتاج سرًّا واحدًا في GitHub: ONESIGNAL_REST_KEY. رقم التطبيق ليس سريًا ومكتوب هنا.
on:
  schedule:
    - cron: '0 9 * * *'         # 12:00 Baghdad, daily gift reminder
    - cron: '50 17 * * *'       # 20:50 Baghdad, ludo tournament starts in 10 minutes
    - cron: '5 20 * * *'        # 23:05 Baghdad, tournament results
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الإشعار (اتركه فارغًا لإشعار المزاد)'
        required: false
      body:
        description: 'نص الإشعار'
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send the message
        env:
          APP_ID: 9ddc0f53-bb77-412c-ae36-359412d8beb9
          REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          EVENT_CRON: ${{ github.event.schedule }}
          IN_TITLE: ${{ github.event.inputs.title }}
          IN_BODY: ${{ github.event.inputs.body }}
        run: |
          if [ -z "$REST_KEY" ]; then echo "::warning::The ONESIGNAL_REST_KEY secret is not set yet."; exit 0; fi
          if [ -n "$IN_TITLE" ]; then
            TITLE="$IN_TITLE"; BODY="$IN_BODY"
          elif [ "$EVENT_CRON" = "50 17 * * *" ]; then
            TITLE="🏆 بطولة اللودو تبدأ بعد ١٠ دقائق"; BODY="من الساعة ٩ لحد ١١ بالليل. كل فوز يرفعك بالترتيب، والأول ياخذ لقب ملك اللودو و٥٠ مليون!"
          elif [ "$EVENT_CRON" = "5 20 * * *" ]; then
            TITLE="👑 انتهت بطولة الليلة"; BODY="ادخل وشوف منو صار ملك اللودو، واستلم جائزتك إذا كنت من الثلاثة الأوائل."
          else
            TITLE="🎁 هديتك اليومية تنتظرك"; BODY="ادخل استلمها، ولف عجلة الحظ، والعب لودو ودومينو وطاولي ويا أصدقائك."
          fi
          jq -n --arg app "$APP_ID" --arg t "$TITLE" --arg b "$BODY" \
            '{app_id:$app, target_channel:"push", included_segments:["Total Subscriptions"], headings:{en:$t, ar:$t}, contents:{en:$b, ar:$b}, url:"https://ibra2002a.github.io/souq/"}' > msg.json
          code=$(curl -s -o out.json -w '%{http_code}' -X POST 'https://api.onesignal.com/notifications?c=push' \
            -H "Authorization: Key $REST_KEY" -H 'Content-Type: application/json' --data @msg.json)
          echo "HTTP $code"; if [ "$code" -ge 300 ]; then echo "::error::OneSignal: $(head -c 400 out.json)"; exit 1; fi
